<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nageshwar Jyotirlinga Temple</title>
<style>
:root{--bg:#fff;--ink:#1d2433;--dim:#6b7385;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--ink:#eef1f7;--dim:#9aa2b5}}
:root[data-theme="dark"]{--bg:#17181c;--ink:#eef1f7;--dim:#9aa2b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,sans-serif}
main{max-width:1000px;margin:0 auto;padding:22px 14px 50px}
h1{font-size:clamp(20px,4vw,30px);font-weight:600;margin:0 0 4px}
p.s{margin:0 0 16px;color:var(--dim);font-size:15px}
.wrap{position:relative;line-height:0;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.wrap svg{width:100%;height:auto;display:block;border-radius:6px;user-select:none}
.hs{position:absolute;border:2px solid transparent;border-radius:4px;cursor:pointer;background:transparent;padding:0;transition:background .15s,border-color .15s}
.hs:hover,.hs:focus-visible,.hs.on{background:rgba(40,120,255,.16);border-color:rgba(20,90,220,.85);outline:none}
.card{position:absolute;z-index:10;width:min(300px,86%);background:#fff;color:#1d2433;border-radius:12px;padding:16px 18px 16px;line-height:1.5;box-shadow:0 8px 28px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.12);display:none}
.card.show{display:block}
.card h2{margin:0 24px 6px 0;font-size:17px}
.card p{margin:0;font-size:14.5px;color:#4a5265}
.card button{position:absolute;top:8px;right:10px;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:#6b7385;padding:4px 8px}
.card button:focus-visible{outline:2px solid #2058dc}
.lbl{position:absolute;left:0;top:0;transform:translate(0,-130%);background:#fff;color:#1d2433;font-size:12px;line-height:1;padding:5px 8px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.2);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.hs:hover .lbl{opacity:1}
@media(max-width:600px){.card{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));top:auto!important;width:auto}.lbl{display:none}}
</style></head><body>
<main>

<rect x="64" y="660" width="12" height="12" fill="#111"/><rect x="206" y="660" width="12" height="12" fill="#111"/><rect x="42" y="592" width="10" height="38"/><rect x="232" y="592" width="10" height="38"/><rect x="132" y="684" width="40" height="16"/><path d="M136 692H168"/>

<path d="M446 418V500H470V524H494V548H518V572H542V596H566V620H590V670H622V715H786V690H898V418" fill="none" stroke="#e4e4e4" stroke-width="7"/>

</g>

<!-- hall -->
<g id="hall">

<g fill="#e4e4e4"><rect x="412" y="266" width="26" height="9"/><rect x="442" y="266" width="26" height="9"/><rect x="584" y="266" width="26" height="9"/><rect x="614" y="266" width="26" height="9"/><rect x="649" y="266" width="26" height="9"/><rect x="786" y="266" width="26" height="9"/><rect x="814" y="266" width="26" height="9"/><rect x="860" y="266" width="26" height="9"/><rect x="890" y="266" width="26" height="9"/></g>
<path d="M410 335H470M860 335H915M410 360H470M860 360H915" fill="none" stroke-width="1"/>

</g>

<path d="M722 218C722 160 735 118 748 90M775 218C775 160 765 118 748 90M748 218V100M705 205C708 150 725 118 748 90M792 205C790 150 770 118 748 90" fill="none" stroke-width="1"/>
<ellipse cx="748" cy="150" rx="11" ry="7"/><ellipse cx="748" cy="182" rx="14" ry="8"/>

<div class="card" id="card" role="dialog" aria-live="polite"><button aria-label="Close">×</button><h2></h2><p></p></div></div>
</main>
<script>
// [id,title,about,x,y,w,h] in 1000x820 image pixels; later items sit on top
const P=[
["site","Site layout","The whole temple ground. The temple stands on the left, with an open court and a pond on the right, all inside a boundary wall and lined with trees.",0,465,440,310],
["siteT","Temple on site","The temple sits at the centre of its own landscaped square. The garbhagriha (G) is at its core.",75,540,180,150],
["S","Marked S","Marked S on the sheet, in the open court beside the temple. It most likely marks the large Shiva statue found in the real temple grounds.",305,565,60,55],
["pond","Pond","The hatched blue shape in the court is drawn as a water feature. The hatching shows water.",270,655,125,95],
["plan","Plan, main level","A top view of the temple at the main level. Thick walls form the outer square, with stepped layers closing in on the central block. The stepped projection at the bottom is the entrance.",30,80,325,300],
["planG","Garbhagriha (G)","The sanctum, marked G. It lies below ground level, so on the plan it appears as an opening at the centre of the main floor.",145,170,95,70],
["below","Below-ground structure","The brick-pattern walls enclose a sunken space under the hall. It is shown in section, where the building is cut open.",440,415,500,300],
["hall","Pillared hall (mandap)","The open hall above ground. Rows of columns carry a layered, stepped roof.",395,235,540,170],
["slab","Main floor level","The thick slab at ground level. Devotees walk on it, and the sanctum opens below through it.",378,395,560,35],
["shikhara","Shikhara","The tall tower over the centre, above the sanctum. It is built in layers that narrow toward the top, ending in a small crown.",655,55,175,200],
["stairs","Staircase","Steps lead down from the main floor into the sunken sanctum.",445,470,150,160],
["garbha","Garbhagriha (below ground)","The sanctum at the lowest point, set in an arched niche. This is where the Jyotirlinga is worshipped.",590,430,260,270],
["linga","Shiva linga","The sacred Jyotirlinga on its base, at the centre of the sanctum.",655,570,115,120]
];

(function(){const T=[[65,487],[103,487],[178,487],[268,498],[322,506],[352,486],[398,520],[17,520],[17,548],[17,576],[17,606],[17,636],[17,666],[17,696],[17,720],[45,708],[80,708],[105,708],[185,708],[210,708],[20,748],[45,748],[70,748],[95,748],[180,750],[210,750],[400,555],[400,590],[400,625],[384,660]];
document.getElementById("trees").innerHTML=T.map(([x,y])=>`<use href="#tr" x="${x-9}" y="${y-9}" width="18" height="18"/>`).join("")})();
const W=1000,H=820,wrap=document.getElementById("wrap"),card=document.getElementById("card");
let cur=null;
function hide(){card.classList.remove("show");document.querySelectorAll(".hs.on").forEach(e=>e.classList.remove("on"));cur=null}
card.querySelector("button").onclick=hide;
P.forEach(([id,t,a,x,y,w,h])=>{
 const b=document.createElement("button");b.className="hs";b.setAttribute("aria-label",t);
 b.style.cssText=`left:${x/W*100}%;top:${y/H*100}%;width:${w/W*100}%;height:${h/H*100}%`;
 b.innerHTML=`<span class="lbl">${t}</span>`;
 b.onclick=e=>{
  e.stopPropagation();
  if(cur===id){hide();return}
  hide();cur=id;b.classList.add("on");
  card.querySelector("h2").textContent=t;card.querySelector("p").textContent=a;
  card.classList.add("show");
  const r=wrap.getBoundingClientRect(),cw=Math.min(300,r.width*.86);
  let l=(x+w/2)/W*r.width-cw/2,tp=(y+h)/H*r.height+10;
  l=Math.max(8,Math.min(l,r.width-cw-8));
  if(tp+170>r.height)tp=Math.max(8,y/H*r.height-170);
  card.style.left=l+"px";card.style.top=tp+"px";
 };
 wrap.appendChild(b);
});
wrap.appendChild(card);
document.addEventListener("click",e=>{if(!card.contains(e.target))hide()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hide()});
</script></body></html>
